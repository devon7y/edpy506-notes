# Publishes site/ to GitHub Pages on every push to main that touches it.
#
# Only site/ is uploaded, so the tests, the tools and anything else in the
# repository root are never served. The unit tests and the prose audit run
# first and a failure stops the deploy; the browser check (tools/check_pages.py)
# needs playwright and is run locally before pushing.

name: Publish the site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'test/**'
      - 'tools/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unit tests
        run: node --test test/*.test.mjs
      - name: Prose audit
        run: python3 tools/check_prose.py

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
